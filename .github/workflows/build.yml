name: build

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build.yml"
      - "include/**"
      - "src/**"
      - "xmake.lua"
  pull_request:
    branches: [ main ]

env:
  XMAKE_PKG_CACHEDIR: ${{ github.workspace }}\.xmake-cache
  XMAKE_PKG_INSTALLDIR: ${{ github.workspace }}\.xmake-packages

jobs:
  xmake:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        mode:
          - releasedbg
        toolchain:
          - msvc
          - clang-cl

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "latest"

      - name: Cache Xmake packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}\.xmake-cache
            ${{ github.workspace }}\.xmake-packages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-xmake-

      - name: config
        run: xmake config -y --mode=${{ matrix.mode }} --toolchain=${{ matrix.toolchain }}

      - name: build
        run: xmake build -y -vD

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: f4ffmpeg-${{ matrix.toolchain }}
          path: |
            build/**/*.dll
            build/**/*.pdb
          if-no-files-found: error
