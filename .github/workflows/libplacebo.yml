name: libplacebo static

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/libplacebo.yml"
      - "tools/libplacebo-smoke/**"
      - "xmake-packages/packages/l/libplacebo/**"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/libplacebo.yml"
      - "tools/libplacebo-smoke/**"
      - "xmake-packages/packages/l/libplacebo/**"

env:
  XMAKE_PKG_CACHEDIR: ${{ github.workspace }}\.xmake-cache-libplacebo
  XMAKE_PKG_INSTALLDIR: ${{ github.workspace }}\.xmake-packages-libplacebo

jobs:
  smoke:
    name: msvc / static
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: tools/libplacebo-smoke

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "latest"

      - name: cache xmake packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}\.xmake-cache-libplacebo
            ${{ github.workspace }}\.xmake-packages-libplacebo
          key: ${{ runner.os }}-${{ runner.arch }}-msvc-libplacebo-static-${{ hashFiles('xmake-packages/packages/l/libplacebo/xmake.lua', 'tools/libplacebo-smoke/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-msvc-libplacebo-static-

      - name: configure
        run: |
          xmake config -y -vD `
            --mode=releasedbg `
            --toolchain=msvc

      - name: build
        run: xmake build -y -vD

      - name: verify no bundled DLLs
        run: |
          $dlls = Get-ChildItem ".\bin" -Filter "*.dll" -File -ErrorAction SilentlyContinue

          if ($dlls) {
            Write-Host "Unexpected DLLs in static smoke output:"
            $dlls | ForEach-Object { Write-Host $_.FullName }
            throw "Static libplacebo smoke output unexpectedly contains DLLs."
          }

          Write-Host "No DLLs bundled with static smoke output."

      - name: run smoke test
        run: .\bin\libplacebo-smoke.exe

      - name: list relevant package files
        if: always()
        run: |
          Write-Host "=== libplacebo/shaderc/SPIRV-Cross installed files ==="

          if (Test-Path "$env:XMAKE_PKG_INSTALLDIR") {
            Get-ChildItem "$env:XMAKE_PKG_INSTALLDIR" `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "placebo|spirv-cross|shaderc"
              } |
              ForEach-Object {
                Write-Host $_.FullName
              }
          }

      - name: upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libplacebo-static-msvc-logs
          path: |
            .xmake-cache-libplacebo/**/logs/**
            .xmake-cache-libplacebo/**/meson-logs/**
            .xmake-cache-libplacebo/**/installdir.failed/logs/**
          if-no-files-found: ignore
