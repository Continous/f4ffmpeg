name: libplacebo static

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/libplacebo.yml"
      - "xmake.lua"
      - "vcpkg-overlays/libplacebo/**"
      - "tools/install-libplacebo-vcpkg.ps1"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/libplacebo.yml"
      - "xmake.lua"
      - "vcpkg-overlays/libplacebo/**"
      - "tools/install-libplacebo-vcpkg.ps1"

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\vcpkg-overlays
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows

jobs:
  build:
    name: msvc f4ffmpeg + clang-cl libplacebo
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: show toolchain
        run: |
          Write-Host "vcpkg:"
          & "$env:VCPKG_ROOT\vcpkg.exe" version

          Write-Host "clang-cl:"
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if (-not $clang) {
            $clang = Get-Command clang-cl -ErrorAction SilentlyContinue
          }
          if ($clang) {
            & $clang.Source --version
          } else {
            Write-Host "clang-cl is not on PATH; the overlay will probe the Visual Studio LLVM directories."
          }

      - name: install static libplacebo with vcpkg
        run: .\tools\install-libplacebo-vcpkg.ps1

      - name: configure f4ffmpeg
        run: |
          xmake config -y -vD `
            --mode=releasedbg `
            --toolchain=msvc `
            --libplacebo_mode=static

      - name: build f4ffmpeg
        run: xmake build -y -vD

      - name: inspect runtime DLL dependencies
        if: always()
        run: |
          $plugin = Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Recurse `
            -Filter "f4ffmpeg.dll" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($plugin) {
            Write-Host "Inspecting $($plugin.FullName)"
            dumpbin /dependents $plugin.FullName
          } else {
            Write-Host "f4ffmpeg.dll was not produced."
          }
